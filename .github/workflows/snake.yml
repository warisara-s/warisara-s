name: Generate Snake Animation

on:
  schedule:
    # สั่งให้ทำงานอัตโนมัติทุกๆ 24 ชั่วโมง
    - cron: "0 0 * * *"
  
  # เปิดให้กดสั่งรันเองได้จากหน้า Actions
  workflow_dispatch:
  
  # สั่งให้ทำงานเมื่อมีการ push โค้ดลง branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # สร้างไฟล์ SVG จาก Contribution Graph
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push ไฟล์ที่สร้างได้ไปเก็บไว้ที่ branch "output"
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
